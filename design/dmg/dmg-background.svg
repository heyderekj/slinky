<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#6F98BE"/>
      <stop offset="0.55" stop-color="#557EA3"/>
      <stop offset="1" stop-color="#456E93"/>
    </linearGradient>
    <radialGradient id="light" cx="0.18" cy="0.0" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stars" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 11.64 6.44 L 10.36 15.56 M 7.38 8.17 L 14.62 13.83 M 6.73 12.72 L 15.27 9.28 M 33.64 28.44 L 32.36 37.56 M 29.38 30.17 L 36.62 35.83 M 28.73 34.72 L 37.27 31.28" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round"/>
    </pattern>
    <!-- Faded in the middle: clear where the icons and words are, the pattern showing toward the edges. -->
    <radialGradient id="fade" cx="300.0" cy="190.0" r="360.0" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(300.0 190.0) scale(1 0.7) translate(-300.0 -190.0)">
      <stop offset="0.6" stop-color="#000000"/>
      <stop offset="0.97" stop-color="#FFFFFF"/>
    </radialGradient>
    <mask id="edges" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="380">
      <rect width="600" height="380" fill="url(#fade)"/>
    </mask>
    <marker id="head" viewBox="0 0 10 10" refX="6.5" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto">
      <path d="M1.5 1.5 L7 5 L1.5 8.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="url(#ground)"/>
  <rect width="600" height="380" fill="url(#light)"/>

  <!-- Slinky asterisks, faded out toward the middle -->
  <rect width="600" height="380" fill="url(#stars)" opacity="0.3" mask="url(#edges)"/>

  <!-- Soft light under each icon -->
  <ellipse cx="160" cy="178" rx="96" ry="84" fill="url(#pool)"/>
  <ellipse cx="440" cy="178" rx="96" ry="84" fill="url(#pool)"/>

  <!-- The arrow: one easy arc, dotted like something on its way -->
  <path d="M 242 172 C 280 132, 320 132, 356 172"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2.6" stroke-linecap="round"
        stroke-dasharray="0.1 9" marker-end="url(#head)"/>

</svg>
